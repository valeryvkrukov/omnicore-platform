framework:
    messenger:
        # Here will be failed messages for further analysis
        failure_transport: failed

        transports:
            # Here is the default transport for handling messages asynchronously
            async:
                dsn: 'doctrine://default'
                options:
                    table_name: 'messenger_messages'
                    queue_name: 'webhook'
                    auto_setup: true # Doctrine will create the table if it doesn't exist
            failed:
                dsn: 'doctrine://default'
                options:
                    table_name: 'messenger_messages'
                    queue_name: 'failed'
            # sync: 'sync://'

        routing:
            # Route the message into async transport
            'OmniCore\Message\ProcessWebhookMessage': async

