name: OmniCore Platform CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: 🐘 Backend Testing (Symfony 8.1 & Postgres 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omnicore_dev_test
          POSTGRES_USER: omnicore_user
          POSTGRES_PASSWORD: omnicore_password
        ports:
          - 5415:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: ./backend

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
        working-directory: ./backend

      - name: Configure Test Environment
        run: |
          echo 'DATABASE_URL="postgresql://omnicore_user:omnicore_password@127.0.0.1:5415/omnicore_dev_test?serverVersion=16&charset=utf8"' > .env.test.local
        working-directory: ./backend

      - name: Run Database Migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
        working-directory: ./backend

      - name: Execute PHPUnit Suite
        run: vendor/bin/phpunit
        working-directory: ./backend

  frontend-build:
    name: ⚡ Frontend Validation (Vue 3 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Compile & Build Verification
        run: npm run build
        working-directory: ./frontend